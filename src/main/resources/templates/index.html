<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理アプリ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/common/list.js}"></script>
    <script th:src="@{/js/index.js}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments/sideMenu :: sideMenu(menus=${menus}, currentPath='task')}"></th:block>
        <main class="main-content">
            <div class="board-header">
                <div class="border-header-top">
                    <h2 class="page-title">タスク一覧</h2>
                    <a th:href="@{/create}" id="create-task" class="btn btn-primary" data-icon="plus">新規タスク作成</a>
                </div>
                <div class="search-and-sort">
                    <form id="search-form" class="search-form" th:action="@{/}" method="get" th:object="${request}">
                        <input type="text" id="search-title" class="form-input" placeholder="タイトル" th:field="*{title}" th:value="${condition.getTitle() != null} ? ${condition.getTitle()}">
                        <input type="text" id="search-details" class="form-input" placeholder="詳細" th:field="*{description}" th:value="${condition.getDescription() != null} ? ${condition.getDescription()}">
                        <input type="date" id="search-due-date" class="form-input" th:field="*{dueDate}" th:value="${condition.getFormattedDueDate()}">
                        <input type="hidden" id="search-sort" th:field="*{sort}" th:value="${condition.getSort().sortKey}">
                        <input type="hidden" id="search-order" th:field="*{order}" th:value="${condition.getOrder().order}">
                        <select id="search-status" class="form-input" th:field="*{status}"/>
                            <option value="" th:selected="${condition.getStatus() == null}">全てのステータス</option>
                            <option th:each="status : ${T(com.example.taskmanager.domain.task.TaskStatus).values()}"
                                    th:value="${status.value}"
                                    th:text="${status.label}"
                                    th:selected="${condition.getStatus() != null && condition.getStatus().equals(status)}">
                            </option>
                        </select>
                        <select id="search-category" class="form-input" th:field="*{categoryId}"/>
                        <option value="" th:selected="${condition.getCategoryId() == null}">全てのカテゴリ</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${condition.getCategoryId() != null && condition.getCategoryId() == category.id}">
                        </option>
                        </select>

                        <div class="sort-controls">
                            <div class="sort-header">
                                <button type="button" id="sort-button" class="btn btn-secondary" th:data-current-sort="${condition.getSort().sortKey}">
                                    <span id="sort-value">期限</span>
                                    <span class="sort-icon">▼</span>
                                </button>
                                <div id="sort-menu" class="sort-menu" style="display: none;">
                                    <th:block th:each="sort : ${T(com.example.taskmanager.domain.task.TaskSort).values()}">
                                        <div class="sort-menu-item" th:data-sort="${sort.sortKey}">
                                            <span th:text="${sort.label}">タイトル</span>
                                        </div>
                                    </th:block>
                                </div>
                            </div>
                            <button type="button" id="sort-direction" class="btn btn-secondary sort-direction-btn" data-direction="asc" th:data-current-direction="${condition.getOrder().order}">
                                <span class="direction-icon">↑</span> 昇順
                            </button>
                        </div>
                        <button id="search-button" type="submit" class="btn btn-primary">検索</button>
                    </form>
                </div>
            </div>
            <div id="table-view-container" class="task-table-view">
                <table id="task-table" class="task-table">
                    <thead>
                        <tr>
                            <th>タイトル</th>
                            <th>詳細</th>
                            <th>期限</th>
                            <th>ステータス</th>
                            <th>カテゴリ</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="all-tasks">
                        <tr th:each="task : ${tasks.getSearchTasks()}">
                            <td th:text="${task.getTitle()}">サンプルタスク</td>
                            <td th:text="${task.getDescription()}">これはサンプルタスクの詳細です。</td>
                            <td th:text="${#temporals.format(task.getDueDate(), 'yyyy-MM-dd')}">2023-12-31</td>
                            <td><span class="status status-incomplete" th:text="${task.getStatus().getLabel()}">未完了</span></td>
                            <td th:text="${task.getCategoryName()}">カテゴリ</td>
                            <td>
                                <a class="btn btn-secondary btn-sm" th:href="@{/edit/{id}(id=${task.getId()})}">編集</a>
                                <button
                                        class="btn btn-secondary btn-sm js-delete-button"
                                        th:data-task-id="${task.getId()}"
                                        th:data-task-title="${task.getTitle()}"
                                        th:data-task-details="${task.getDescription()}"
                                        th:data-task-due-date="${#temporals.format(task.getDueDate(), 'yyyy-MM-dd')}">
                                    削除
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <form id="pager-form" th:action="@{/}" method="get" th:object="${request}">
                    <input type="hidden" th:if="${request.getTitle() != null}" th:value="${request.getTitle()}" th:field="*{title}">
                    <input type="hidden" th:if="${request.getDescription() != null}" th:value="${request.getDescription()}" th:field="*{description}">
                    <input type="hidden" th:if="${request.getDueDate() != null}" th:value="${request.getDueDate()}" th:field="*{dueDate}">
                    <input type="hidden" th:if="${request.getStatus() != null}" th:value="${request.getStatus().value}" th:field="*{status}">
                    <input type="hidden" th:if="${request.getCategoryId() != null}" th:value="${request.getCategoryId()}" th:field="*{categoryId}">
                    <input id="page" type="hidden" th:field="*{page}" th:value="${pager.page}">

                    <div class="pagination">
                        <button id="prev-page" class="btn btn-secondary" data-icon="prev" th:disabled="${!pager.hasPrevious()}" th:data-prev-page="${pager.getPreviousPage()}">前へ</button>
                        <span id="page-info"><th:block th:text="${pager.getPage()}"></th:block><span id="current-page"></span> / <span id="total-pages"></span><th:block th:text="${pager.getTotalPage()}"></th:block></span>
                        <button id="next-page" class="btn btn-secondary" data-icon="next" th:disabled="${!pager.hasNext()}" th:data-next-page="${pager.getNextPage()}" onclick="setNextPage()">次へ</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <h2>タスクの削除</h2>
            <p>以下のタスクを削除してもよろしいですか？</p>
            <div id="task-to-delete">
                <p><strong>タイトル:</strong> <span id="delete-task-title">サンプルタスク</span></p>
                <p><strong>詳細:</strong> <span id="delete-task-details">これはサンプルタスクの詳細です。</span></p>
                <p><strong>期限:</strong> <span id="delete-task-due-date">2023-12-31</span></p>
            </div>
            <div class="modal-actions">
                <button id="confirm-delete" class="btn btn-danger js-delete-modal-chancel-button">削除</button>
                <button id="delete-modal-chancel" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>
</body>
</html>
