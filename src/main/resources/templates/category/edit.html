<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ編集 - タスク管理アプリ</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments/sideMenu :: sideMenu(menus=${menus}, currentPath='category')}"></th:block>
        <main class="main-content">
            <div class="content-area">
                <h2 class="page-title">タスク編集</h2>
                <form id="edit-task-form" class="task-form" method="post" th:action="@{/category/edit/{id}(id=${category.id})}" th:object="${updateCategoryRequest}">
                    <div class="form-group">
                        <label for="name">カテゴリ名</label>
                        <input type="text" id="name" class="form-input" name="name"
                               th:value="${updateCategoryRequest.getName() != null ? updateCategoryRequest.getName() : category.getName()}"
                        >
                        <ul th:if="${#fields.hasErrors('name')}" class="error">
                            <li th:each="error : ${#fields.errors('name')}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">更新</button>
                        <a th:href="@{/category}" class="btn btn-secondary">キャンセル</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="../static/js/edit.js"></script>
</body>
</html>
