<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理アプリ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/common/list.js}"></script>
    <script th:src="@{/js/category/index.js}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments/sideMenu :: sideMenu(menus=${menus}, currentPath='/category')}"></th:block>
        <main class="main-content">
            <div class="board-header">
                <div class="border-header-top">
                    <h2 class="page-title">カテゴリ一覧</h2>
                    <a th:href="@{/category/create}" id="create-task" class="btn btn-primary" data-icon="plus">新規カテゴリ作成</a>
                </div>
                <div class="search-and-sort">
                    <form id="search-form" class="search-form" th:action="@{/category}" method="get" th:object="${request}">
                        <input type="text" id="search-title" class="form-input" placeholder="カテゴリ名" th:field="*{name}" th:value="${condition.getName() != null} ? ${condition.getName()}">
                        <input type="hidden" id="search-sort" th:field="*{sort}" th:value="${condition.getSort().sortKey}">
                        <input type="hidden" id="search-order" th:field="*{order}" th:value="${condition.getOrder().order}">

                        <div class="sort-controls">
                            <div class="sort-header">
                                <button type="button" id="sort-button" class="btn btn-secondary" th:data-current-sort="${condition.getSort().sortKey}">
                                    <span id="sort-value">名前</span>
                                    <span class="sort-icon">▼</span>
                                </button>
                                <div id="sort-menu" class="sort-menu" style="display: none;">
                                    <th:block th:each="sort : ${T(com.example.taskmanager.domain.category.CategorySort).values()}">
                                        <div class="sort-menu-item" th:data-sort="${sort.sortKey}">
                                            <span th:text="${sort.label}">タイトル</span>
                                        </div>
                                    </th:block>
                                </div>
                            </div>
                            <button type="button" id="sort-direction" class="btn btn-secondary sort-direction-btn" data-direction="asc" th:data-current-direction="${condition.getOrder().order}">
                                <span class="direction-icon">↑</span> 昇順
                            </button>
                        </div>
                        <button id="search-button" type="submit" class="btn btn-primary">検索</button>
                    </form>
                </div>
            </div>
            <div id="table-view-container" class="task-table-view">
                <table id="task-table" class="task-table">
                    <thead>
                        <tr>
                            <th>カテゴリ名</th>
                        </tr>
                    </thead>
                    <tbody id="all-tasks">
                        <tr th:each="category : ${categories.getCategories()}">
                            <td th:text="${category.getName()}">サンプルカテゴリ</td>
                            <td>
                                <a class="btn btn-secondary btn-sm" th:href="@{category/edit/{id}(id=${category.getId()})}">編集</a>
                                <button
                                        class="btn btn-secondary btn-sm js-delete-button"
                                        th:data-category-id="${category.getId()}"
                                        th:data-category-name="${category.getName()}">
                                    削除
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <form id="pager-form" th:action="@{/}" method="get" th:object="${request}">
                    <input type="hidden" th:if="${request.getName() != null}" th:value="${request.getName()}" th:field="*{name}">
                    <input id="page" type="hidden" th:field="*{page}" th:value="${pager.page}">

                    <div class="pagination">
                        <button id="prev-page" class="btn btn-secondary" data-icon="prev" th:disabled="${!pager.hasPrevious()}" th:data-prev-page="${pager.getPreviousPage()}">前へ</button>
                        <span id="page-info"><th:block th:text="${pager.getPage()}"></th:block><span id="current-page"></span> / <span id="total-pages"></span><th:block th:text="${pager.getTotalPage()}"></th:block></span>
                        <button id="next-page" class="btn btn-secondary" data-icon="next" th:disabled="${!pager.hasNext()}" th:data-next-page="${pager.getNextPage()}" onclick="setNextPage()">次へ</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <h2>カテゴリの削除</h2>
            <p>以下のカテゴリを削除してもよろしいですか？</p>
            <div id="category-to-delete">
                <p><strong>タイトル:</strong> <span id="delete-category-name">サンプルタスク</span></p>
            </div>
            <div class="modal-actions">
                <button id="confirm-delete" class="btn btn-danger js-delete-modal-chancel-button">削除</button>
                <button id="delete-modal-chancel" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>
</body>
</html>
