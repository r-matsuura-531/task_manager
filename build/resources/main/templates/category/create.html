<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規タスク作成 - タスク管理アプリ</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments/sideMenu :: sideMenu(menus=${menus}, currentPath='/category/create')}"></th:block>
        <main class="main-content">
            <div class="content-area">
                <h2 class="page-title">新規カテゴリ作成</h2>
                <form id="task-form" class="task-form" method="post" th:action="@{/category/create}" th:object="${createCategoryRequest}">
                    <div class="form-group">
                        <label for="name">カテゴリ名</label>
                        <input type="text" id="name" class="form-input" th:field="*{name}">
                        <ul th:if="${#fields.hasErrors('name')}" class="error">
                            <li th:each="error : ${#fields.errors('name')}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">カテゴリを作成</button>
                        <a th:href="@{/category}" class="btn btn-secondary">キャンセル</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
