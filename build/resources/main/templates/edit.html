<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク編集 - タスク管理アプリ</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments/sideMenu :: sideMenu(menus=${menus}, currentPath='task')}"></th:block>
        <main class="main-content">
            <div class="content-area">
                <h2 class="page-title">タスク編集</h2>
                <form id="edit-task-form" class="task-form" method="post" th:action="@{/edit/{id}(id=${task.id})}" th:object="${updateTaskRequest}">
                    <div class="form-group">
                        <label for="title">タイトル</label>
                        <input type="text" id="title" class="form-input" name="title"
                               th:value="${updateTaskRequest.getTitle() != null ? updateTaskRequest.getTitle() : task.getTitle()}"
                        >
                        <ul th:if="${#fields.hasErrors('title')}" class="error">
                            <li th:each="error : ${#fields.errors('title')}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <div class="form-group">
                        <label for="details">詳細</label>
                        <textarea id="details" rows="4" class="form-input" name="description"
                                    th:text="${updateTaskRequest.getDescription() != null ? updateTaskRequest.getDescription() : task.description}"
                        ></textarea>
                        <ul th:if="${#fields.hasErrors('description')}" class="error">
                            <li th:each="error : ${#fields.errors('description')}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dueDate">期限日</label>
                            <input type="date" id="dueDate" class="form-input" name="dueDate"
                                   th:value="${updateTaskRequest.getDueDate() != null ?
                                        #temporals.format(updateTaskRequest.getDueDate(), 'yyyy-MM-dd') :
                                        #temporals.format(task.getDueDate(), 'yyyy-MM-dd')}"
                            />
                            <ul th:if="${#fields.hasErrors('dueDate')}" class="error">
                                <li th:each="error : ${#fields.errors('dueDate')}" th:text="${error}"></li>
                            </ul>
                        </div>
                        <div class="form-group">
                            <label for="status">ステータス</label>
                            <select id="status" name="status" class="form-input" th:field="*{status}"/>
                                <th:block th:each="status : ${T(com.example.taskmanager.domain.task.TaskStatus).values()}">
                                    <option
                                            th:value="${status}"
                                            th:text="${status.label}"
                                            th:selected="${updateTaskRequest.getStatus() != null ? updateTaskRequest.getStatus().equals(status) : task.getStatus().equals(status)}"
                                    ></option>
                                </th:block>
                            </select>
                            <ul th:if="${#fields.hasErrors('status')}" class="error">
                                <li th:each="error : ${#fields.errors('status')}" th:text="${error}"></li>
                            </ul>
                        </div>
                        <div class="form-group">
                            <label for="status">カテゴリ</label>
                            <select id="category" name="category" class="form-input" th:field="*{categoryId}"/>
                            <th:block th:each="category : ${categories}">
                                <option
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${updateTaskRequest.getCategoryId() != null ? updateTaskRequest.getCategoryId() == category.id : task.categoryName == category.name}"
                                ></option>
                            </th:block>
                            </select>
                            <ul th:if="${#fields.hasErrors('categoryId')}" class="error">
                                <li th:each="error : ${#fields.errors('categoryId')}" th:text="${error}"></li>
                            </ul>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">更新</button>
                        <a th:href="@{/}" class="btn btn-secondary">キャンセル</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
